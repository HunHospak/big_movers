name: publish-big-movers

on:
  schedule:
    # Weekdays ~ after US close (21:30 UTC). Adjust to taste.
    - cron: "30 21 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: publish-${{ github.repository }}
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Offline feed contract tests
        run: python -m unittest discover -s tests -p 'test_*.py'

      - name: Build feed
        env:
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
        run: |
          python src/build_feed.py
          python scripts/post_text.py

      - name: Validate feed before publication
        run: python scripts/validate_feed.py

      - name: Publish out/ to GitHub Pages
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out
          # The feed will be served at:
          #   https://<user>.github.io/big_movers/big_movers.json
